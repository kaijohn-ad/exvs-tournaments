name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - typecheck
        - test

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'remix/.nvmrc'
        cache: 'npm'
        cache-dependency-path: 'remix/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./remix
      run: npm ci
    
    - name: Run type check
      working-directory: ./remix
      run: npm run typecheck
    
    - name: Run tests
      working-directory: ./remix
      run: npm run test

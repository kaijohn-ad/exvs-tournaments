name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
      - feature/remix-workers-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        cache-dependency-path: 'remix/package-lock.json'

    - name: Install dependencies
      working-directory: ./remix
      run: npm ci

    - name: Type check
      working-directory: ./remix
      run: npm run typecheck

    - name: Build Remix app
      working-directory: ./remix
      run: npm run build

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: exvs-tournaments
        directory: remix/build/client
        wranglerConfigPath: remix/wrangler.toml
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
